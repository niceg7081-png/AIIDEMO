<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaDent — портал власника</title><style>
:root{--ink:#172033;--navy:#101827;--blue:#3867e8;--bg:#f4f6fb;--muted:#667085;--line:#e6eaf0;--green:#057a55;--orange:#b54708;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Arial;color:var(--ink);background:var(--bg)}.login{width:min(420px,calc(100% - 32px));margin:13vh auto;background:#fff;border:1px solid var(--line);padding:32px;border-radius:22px;box-shadow:0 18px 45px #24304a12}.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:800;color:var(--blue)}h1{font-size:28px;margin:8px 0}p{color:var(--muted);line-height:1.5}.login input,.search{width:100%;padding:13px 14px;border:1px solid #d5dbe6;border-radius:10px;font:inherit;margin:18px 0 12px}.button{border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;padding:12px 16px;cursor:pointer}.button:hover{filter:brightness(.96)}.error{min-height:20px;color:var(--red);font-size:14px}.shell{display:grid;grid-template-columns:244px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#fff;padding:26px 18px}.brand{font-weight:800;font-size:22px}.brand small{display:block;color:#aebbd1;font-size:12px;font-weight:500;margin-top:3px}.side-label{font-size:11px;color:#8290a7;font-weight:800;letter-spacing:.08em;margin:38px 10px 8px}.side-item{width:100%;border:0;background:transparent;color:#dbe4f2;text-align:left;padding:12px;border-radius:9px;font:inherit;cursor:pointer}.side-item.active,.side-item:hover{background:#243148;color:#fff}.content{padding:30px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:26px}.top h1{margin:0}.live{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:13px;background:#e9f8ef;padding:8px 11px;border-radius:99px}.live:before{content:"";width:7px;height:7px;background:#12b76a;border-radius:50%}.logout{background:#fff;color:var(--ink);border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:16px}.stat{padding:18px}.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:29px;margin-top:7px}.card{padding:20px}.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.toolbar h2{font-size:19px;margin:0}.search{width:min(290px,100%);margin:0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:820px}th{text-align:left;padding:12px 10px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}td{padding:15px 10px;border-bottom:1px solid #eef1f5;font-size:14px}.patient{font-weight:750}.phone{color:var(--muted);font-size:12px;margin-top:3px}.badge{display:inline-block;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:700}.badge.new{background:#eef4ff;color:#175cd3}.badge.confirmed{background:#fff4e5;color:var(--orange)}.badge.done{background:#e9f8ef;color:var(--green)}.badge.cancelled{background:#fff0ef;color:var(--red)}select{border:1px solid #d5dbe6;background:#fff;padding:7px 8px;border-radius:8px;font:inherit;font-size:13px}.empty{text-align:center;color:var(--muted);padding:35px}.footer-note{margin-top:14px;font-size:12px;color:var(--muted)}.hidden{display:none}@media(max-width:800px){.shell{grid-template-columns:1fr}.sidebar{padding:18px}.side-label,.side-item{display:none}.content{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.toolbar{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="app"></div><script>
let token=localStorage.getItem('nova_owner_token'),data=null;const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(){app.innerHTML=`<main class="login"><div class="eyebrow">NOVADENT</div><h1>Портал власника</h1><p>Керування заявками та записами клініки в одному місці.</p><input id="password" type="password" placeholder="Пароль власника" autocomplete="current-password"><button class="button" onclick="signIn()">Увійти до порталу</button><div id="error" class="error"></div></main>`}
async function signIn(){const password=document.getElementById('password').value;const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const j=await r.json();if(!r.ok){document.getElementById('error').textContent='Невірний пароль. Спробуйте ще раз.';return}token=j.token;localStorage.setItem('nova_owner_token',token);await load()}
function statusClass(s){return ({'Новий':'new','Підтверджено':'confirmed','Завершено':'done','Скасовано':'cancelled'})[s]||'new'}function options(current){return ['Новий','Підтверджено','Завершено','Скасовано'].map(s=>`<option ${s===current?'selected':''}>${s}</option>`).join('')}
function render(){const a=data.appointments||[],today=new Date().toISOString().slice(0,10),todayCount=a.filter(x=>x.date===today).length,confirmed=a.filter(x=>x.status==='Підтверджено').length;app.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">NovaDent<small>Портал власника</small></div><div class="side-label">КЕРУВАННЯ</div><button class="side-item active">Огляд і записи</button><div class="side-label">СИСТЕМА</div><button class="side-item" onclick="location.href='/'">Відкрити сайт клініки ↗</button><button class="side-item" onclick="logout()">Вийти з порталу</button></aside><main class="content"><div class="top"><div><div class="eyebrow">КЕРУВАННЯ КЛІНІКОЮ</div><h1>Записи та звернення</h1><p>Дані оновлюються автоматично кожні 15 секунд.</p></div><div><span class="live">Синхронізація активна</span> <button class="button logout" onclick="load()">Оновити</button></div></div><section class="stats"><div class="stat"><span>Усього пацієнтів</span><b>${data.stats.patients}</b></div><div class="stat"><span>Нові записи</span><b>${a.filter(x=>x.status==='Новий'||x.status==='Scheduled').length}</b></div><div class="stat"><span>Підтверджено</span><b>${confirmed}</b></div><div class="stat"><span>Записів сьогодні</span><b>${todayCount}</b></div></section><section class="card"><div class="toolbar"><div><h2>Таблиця записів</h2><p>Кожен запис із сайту одразу з’являється тут.</p></div><input class="search" id="search" oninput="filterRows()" placeholder="Пошук за ім’ям або телефоном"></div><div class="table-wrap"><table><thead><tr><th>ПАЦІЄНТ</th><th>ПОСЛУГА</th><th>ДАТА ТА ЧАС</th><th>ЛІКАР</th><th>СТАТУС</th><th>ЗМІНИТИ</th></tr></thead><tbody id="rows">${rows(a)}</tbody></table></div><div class="footer-note">Останнє оновлення: <span id="updated">${new Date().toLocaleTimeString('uk-UA')}</span></div></section></main></div>`}
function rows(items){if(!items.length)return '<tr><td colspan="6" class="empty">Записів ще немає. Вони з’являться після оформлення на сайті.</td></tr>';return items.slice().sort((x,y)=>`${y.date}${y.time}`.localeCompare(`${x.date}${x.time}`)).map(x=>{const s=x.status==='Scheduled'?'Новий':x.status;return `<tr data-search="${esc((x.name+' '+x.phone).toLowerCase())}"><td><div class="patient">${esc(x.name)}</div><div class="phone">${esc(x.phone)}</div></td><td>${esc(x.service)}</td><td><b>${esc(x.date)}</b><div class="phone">${esc(x.time)}</div></td><td>${esc(x.doctor)}</td><td><span class="badge ${statusClass(s)}">${esc(s)}</span></td><td><select onchange="changeStatus('${esc(x.id)}',this.value)">${options(s)}</select></td></tr>`}).join('')}
function filterRows(){const q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('#rows tr[data-search]').forEach(row=>row.classList.toggle('hidden',!row.dataset.search.includes(q)))}
async function changeStatus(id,status){const r=await fetch('/api/admin/appointments/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status})});if(!r.ok){alert('Не вдалося змінити статус. Оновіть сторінку та повторіть.');return}await load()}
async function load(){const r=await fetch('/api/admin/data',{headers:{Authorization:'Bearer '+token}});if(r.status===401){localStorage.removeItem('nova_owner_token');token=null;login();return}data=await r.json();render()}
async function logout(){await fetch('/api/admin/logout',{method:'POST',headers:{Authorization:'Bearer '+token}});localStorage.removeItem('nova_owner_token');token=null;login()}if(token)load();else login();setInterval(()=>{if(token)load()},15000);
</script></body></html>
