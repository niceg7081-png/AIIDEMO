<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaDent — кабінет власника</title><style>
body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:30px}.login,.panel,.stat{background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:24px}.login{max-width:420px;margin:80px auto}.row{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:180px}.stat b{font-size:30px;display:block;margin-top:6px}input{width:100%;padding:12px;border:1px solid #dce2ea;border-radius:10px;margin:8px 0 14px;box-sizing:border-box}.btn{border:0;background:#172033;color:#fff;padding:12px 16px;border-radius:10px;cursor:pointer}.tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.tabs button{padding:10px 14px;border:1px solid #dce2ea;background:#fff;border-radius:9px;cursor:pointer}.tabs button.active{background:#172033;color:#fff}.tab{display:none}.tab.active{display:block}.item{padding:13px;border-bottom:1px solid #edf0f4}.muted{color:#657083;font-size:13px}</style></head><body><div class="wrap" id="app"></div>
<script>
let token=localStorage.getItem("nova_admin_token");
const app=document.getElementById("app");
function login(){app.innerHTML=`<div class="login"><h1>NovaDent</h1><p class="muted">Кабінет власника</p><input id="pw" type="password" placeholder="Пароль власника"><button class="btn" onclick="doLogin()">Увійти</button><p id="err" class="muted"></p></div>`}
async function doLogin(){const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("pw").value})});const j=await r.json();if(!r.ok)return document.getElementById("err").textContent="Невірний пароль";token=j.token;localStorage.setItem("nova_admin_token",token);dashboard()}
async function dashboard(){const r=await fetch("/api/admin/data",{headers:{Authorization:"Bearer "+token}});if(r.status===401){localStorage.removeItem("nova_admin_token");return login()}const d=await r.json();app.innerHTML=`<h1>Кабінет власника NovaDent</h1><p class=muted>Захищена панель керування записами</p><div class=row><div class=stat>Пацієнти<b>${d.stats.patients}</b></div><div class=stat>Заявки<b>${d.stats.leads}</b></div><div class=stat>Записи<b>${d.stats.appointments}</b></div></div><div class=tabs><button class=active onclick="tab('appointments',this)">Записи</button><button onclick="tab('patients',this)">Пацієнти</button><button onclick="tab('leads',this)">Заявки</button><button onclick="logout()">Вийти</button></div><div id=appointments class="panel tab active"><h2>Записи на прийом</h2>${d.appointments.map(x=>`<div class=item><b>${x.date} ${x.time}</b> · ${x.name}<br><span class=muted>${x.service} · ${x.doctor} · ${x.phone}</span></div>`).join("")||"<p>Записів ще немає.</p>"}</div><div id=patients class="panel tab"><h2>Пацієнти</h2>${d.patients.map(x=>`<div class=item><b>${x.name}</b><br><span class=muted>${x.phone}</span></div>`).join("")||"<p>Пацієнтів ще немає.</p>"}</div><div id=leads class="panel tab"><h2>Заявки</h2>${d.leads.map(x=>`<div class=item><b>${x.name}</b> · ${x.status}<br><span class=muted>${x.service} · ${x.phone}</span></div>`).join("")||"<p>Заявок ще немає.</p>"}</div>`}
function tab(id,b){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");b.classList.add("active")}
async function logout(){await fetch("/api/admin/logout",{method:"POST",headers:{Authorization:"Bearer "+token}});localStorage.removeItem("nova_admin_token");login()}
if(token)dashboard();else login();
</script></body></html>
